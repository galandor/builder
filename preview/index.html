<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Строим дом</title>
  <style>
    :root {
      --ink: #243044;
      --sky: #79c7f5;
      --grass: #62be4e;
      --grass-dark: #3e9a32;
      --dirt: #e4b86a;
      --wall: #ffd84a;
      --roof: #e23b3b;
    }

    * { box-sizing: border-box; }
    html, body, #app { height: 100%; height: 100dvh; }
    html { touch-action: manipulation; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: var(--grass);
      font-family: "Arial Rounded MT Bold", "Trebuchet MS", "Segoe UI", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    button { font: inherit; color: inherit; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }

    #pick {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--sky);
      position: relative;
      overflow: auto;
    }
    .pick-sun {
      position: absolute;
      top: 18px;
      right: 22px;
      width: 72px;
      height: 72px;
      background: #ffe14a;
      border: 4px solid var(--ink);
      border-radius: 50%;
    }
    .title, .ask {
      position: relative;
      margin: 0;
      background: #fff;
      border: 4px solid var(--ink);
      border-radius: 18px;
      padding: 8px 18px;
    }
    .title { font-size: clamp(32px, 6vw, 60px); }
    .ask { font-size: clamp(22px, 3.4vw, 36px); }
    .choices {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 16px;
      width: min(980px, 100%);
      padding: 8px 12px 28px;
    }
    .choice {
      width: min(240px, 42vw);
      min-width: 148px;
      background: var(--grass);
      border: 4px solid var(--ink);
      border-radius: 24px;
      padding: 10px 10px 0;
      cursor: pointer;
    }
    .choice:active { transform: translateY(3px); }
    .choice .house-svg { width: 100%; height: auto; display: block; }

    #play {
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--sky);
    }
    .prompt {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px;
      padding: 8px 10px 8px 16px;
      background: #fff;
      border: 4px solid var(--ink);
      border-radius: 18px;
      z-index: 6;
    }
    #play.finished .prompt { visibility: hidden; }
    .prompt p {
      flex: 1;
      margin: 0;
      font-size: clamp(18px, 2.5vw, 32px);
      font-weight: 800;
      line-height: 1.25;
    }
    #again {
      flex: 0 0 auto;
      width: 64px;
      height: 64px;
      border: 4px solid var(--ink);
      border-radius: 50%;
      background: #ffe14a;
      padding: 0;
      cursor: pointer;
    }
    #again svg { width: 36px; height: 36px; display: block; margin: 0 auto; }

    #field {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }
    .sun {
      position: absolute;
      top: 10px;
      right: 16px;
      width: 58px;
      height: 58px;
      background: #ffe14a;
      border: 4px solid var(--ink);
      border-radius: 50%;
    }
    .cloud { position: absolute; height: 28px; }
    .cloud span {
      position: absolute;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 50%;
    }
    .cloud span:nth-child(1) { width: 34px; height: 34px; left: 0; top: 8px; }
    .cloud span:nth-child(2) { width: 46px; height: 46px; left: 22px; top: 0; }
    .cloud span:nth-child(3) { width: 32px; height: 32px; left: 54px; top: 12px; }
    .c1 { left: 6%; top: 12%; width: 92px; animation: drift 18s ease-in-out infinite alternate; }
    .c2 { left: 38%; top: 6%; width: 92px; animation: drift 22s ease-in-out infinite alternate-reverse; }
    @keyframes drift { to { transform: translateX(28px); } }

    .grass {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 58%;
      background: var(--grass);
    }
    .tree { position: absolute; bottom: 30%; z-index: 2; width: 70px; }
    .tree.right { right: 2%; }
    .tree.left { left: 1%; }
    .crown {
      width: 70px; height: 58px;
      background: #3e9a32;
      border: 4px solid var(--ink);
      border-radius: 50%;
    }
    .trunk {
      width: 16px; height: 28px;
      margin: -8px auto 0;
      background: #c47a3a;
      border: 4px solid var(--ink);
      border-radius: 4px;
    }
    .plot {
      position: absolute;
      left: 12%;
      right: 12%;
      bottom: 7%;
      height: 48%;
      background: var(--dirt);
      border: 4px solid var(--ink);
      border-radius: 22px;
      z-index: 1;
    }
    .fence {
      position: absolute;
      left: 9%;
      right: 9%;
      bottom: 4%;
      height: 55%;
      z-index: 3;
      pointer-events: none;
    }
    .run, .leaf {
      background:
        linear-gradient(#c47a3a, #c47a3a) 0 0 / 100% 7px no-repeat,
        linear-gradient(#243044, #243044) 0 7px / 100% 3px no-repeat,
        linear-gradient(#c47a3a, #c47a3a) 0 58% / 100% 5px no-repeat,
        linear-gradient(#243044, #243044) 0 calc(58% + 5px) / 100% 3px no-repeat,
        repeating-linear-gradient(90deg,
          #243044 0 2px,
          #f7e7c8 2px 11px,
          #e6d2aa 11px 13px,
          #243044 13px 15px,
          transparent 15px 22px);
      box-shadow: 0 3px 0 rgba(36, 48, 68, 0.16);
    }
    .run { position: absolute; }
    .run.back { left: 0; right: 0; top: 0; height: 38px; }
    .run.side { top: 0; bottom: 0; width: 22px; }
    .run.side.l { left: 0; }
    .run.side.r { right: 0; }
    .run.front { bottom: 0; height: 42px; width: 31%; }
    .run.front.l { left: 0; }
    .run.front.r { right: 0; }
    .post {
      position: absolute;
      width: 14px;
      background: linear-gradient(90deg, #f0d7b0, #c47a3a 55%, #a56a32);
      border: 3px solid var(--ink);
      border-radius: 4px;
      box-shadow: 0 3px 0 rgba(36, 48, 68, 0.16);
    }
    .post.p1 { left: -4px; top: -6px; height: 50px; }
    .post.p2 { right: -4px; top: -6px; height: 50px; }
    .post.p3 { left: -4px; bottom: -4px; height: 52px; }
    .post.p4 { right: -4px; bottom: -4px; height: 52px; }
    .post.hinge-l { left: 31%; bottom: -4px; height: 52px; margin-left: -7px; }
    .post.hinge-r { right: 31%; bottom: -4px; height: 52px; margin-right: -7px; }
    .gate {
      position: absolute;
      left: 31%;
      right: 31%;
      bottom: 0;
      height: 68px;
      z-index: 2;
    }
    .leaf {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      border-radius: 4px;
      background:
        linear-gradient(#243044, #243044) 0 16% / 100% 4px no-repeat,
        linear-gradient(#243044, #243044) 0 78% / 100% 4px no-repeat,
        linear-gradient(118deg, transparent 45%, #c47a3a 45% 55%, transparent 55%),
        repeating-linear-gradient(90deg,
          #243044 0 2px,
          #ffe7a3 2px 12px,
          #f0d07a 12px 14px,
          #243044 14px 16px,
          transparent 16px 20px);
      box-shadow: inset 0 5px 0 rgba(255, 255, 255, 0.35), 0 3px 0 rgba(36, 48, 68, 0.16);
      transition: transform 0.5s cubic-bezier(.2, .85, .2, 1);
    }
    .leaf.l { left: 0; transform-origin: left center; }
    .leaf.r { right: 0; transform-origin: right center; }
    .gates-open .leaf.l,
    .gates-open .leaf.r { transform: scaleX(0.08); }
    .trench {
      position: absolute;
      left: 16%;
      width: 68%;
      bottom: 10%;
      height: 42px;
      background: #8d6239;
      border: 4px solid var(--ink);
      border-radius: 40px;
      z-index: 2;
      transform: scaleX(0);
      transform-origin: left center;
    }
    #field.has-trench .trench { transform: scaleX(1); transition: transform 1.1s ease-out; }
    .pipes-in {
      position: absolute;
      left: 20%;
      width: 58%;
      bottom: 14%;
      height: 22px;
      z-index: 3;
      opacity: 0;
    }
    #field.has-pipes .pipes-in { opacity: 1; }
    #field.has-asphalt .trench,
    #field.has-asphalt .pipes-in { opacity: 0; transition: opacity 0.35s linear 0.85s; }
    .pipe {
      position: absolute;
      top: 0;
      height: 18px;
      border-radius: 10px;
      background: #3aa0c8;
      border: 3px solid var(--ink);
    }
    .pipe.p1 { left: 0; width: 38%; }
    .pipe.p2 { left: 32%; width: 36%; top: 2px; }
    .pipe.p3 { left: 62%; width: 38%; }

    .asphalt {
      position: absolute;
      left: 16%;
      width: 68%;
      bottom: 10%;
      height: 56px;
      background: #6b7280;
      border: 4px solid var(--ink);
      border-radius: 8px;
      z-index: 2;
      transform: scaleX(0);
      transform-origin: left center;
    }
    #field.has-asphalt .asphalt { transform: scaleX(1); transition: transform 1.3s linear; }

    .build {
      position: absolute;
      left: 50%;
      bottom: calc(6% + 40px);
      width: min(34%, 280px);
      transform: translateX(-50%);
      z-index: 5;
    }
    .house-svg { width: 100%; height: auto; display: block; overflow: visible; }
    .roof-target {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 0;
      height: 32%;
    }
    .foundation {
      height: 26px;
      margin: -4px -4% 0;
      background: #cfd2d6;
      border: 4px solid var(--ink);
      border-radius: 8px;
      transform: scaleY(0);
      transform-origin: bottom center;
    }
    #field.has-foundation .foundation,
    #field.pouring .foundation {
      transform: scaleY(1);
      transition: transform 1s linear;
    }
    #field .walls-group {
      transform: scaleY(0);
      transform-box: fill-box;
      transform-origin: center bottom;
    }
    #field.has-walls .walls-group {
      transform: scaleY(1);
      transition: transform 1.05s ease-out;
    }
    #field .openings { opacity: 0; }
    #field.has-openings .openings { opacity: 1; transition: opacity 0.35s ease; }
    #field .roof-shape { opacity: 0; }
    #field.has-roof .roof-shape { opacity: 1; transition: opacity 0.25s ease; }

    .debris { position: absolute; left: 14%; right: 14%; bottom: 12%; height: 34%; z-index: 6; }
    .bit {
      position: absolute;
      border: 4px solid var(--ink);
      transition: transform 1.05s ease, opacity 0.35s ease;
    }
    .rock { background: #9aa3ad; border-radius: 40% 50% 45% 55%; }
    .bush { background: #3e9a32; border-radius: 50%; }
    .crate { background: #c47a3a; border-radius: 6px; }
    .b1 { left: 2%; bottom: 8%; width: clamp(52px, 7vw, 92px); height: clamp(42px, 5vw, 70px); }
    .b2 { left: 22%; bottom: 36%; width: clamp(58px, 8vw, 100px); height: clamp(48px, 6vw, 78px); }
    .b3 { left: 44%; bottom: 6%; width: clamp(46px, 6vw, 78px); height: clamp(46px, 6vw, 78px); }
    .b4 { left: 62%; bottom: 34%; width: clamp(54px, 7vw, 90px); height: clamp(40px, 5vw, 66px); }
    .b5 { left: 80%; bottom: 8%; width: clamp(48px, 6vw, 80px); height: clamp(48px, 6vw, 80px); }
    #field.pushing .bit { transform: translateX(30vw) scale(0.5); }
    #field:not(.has-debris) .debris { opacity: 0; }

    .trash-pile {
      position: absolute;
      right: 7%;
      bottom: 16%;
      width: 130px;
      height: 96px;
      z-index: 6;
      opacity: 0;
    }
    #field.has-trash .trash-pile { opacity: 1; transition: opacity 0.35s ease; }
    .blob {
      position: absolute;
      border: 3px solid var(--ink);
      border-radius: 50%;
    }
    .blob.g1 { width: 40px; height: 40px; left: 6px; bottom: 0; background: #8d97a3; }
    .blob.g2 { width: 46px; height: 46px; left: 30px; bottom: 8px; background: #6b7280; }
    .blob.g3 { width: 34px; height: 28px; left: 48px; bottom: 0; background: #c47a3a; border-radius: 6px; }

    .loose {
      position: absolute;
      z-index: 7;
      opacity: 0;
    }
    #field.has-roof-ground .roof-ground,
    #field.has-pipes-ground .pipes-ground { opacity: 1; }
    .roof-ground { left: 66%; bottom: 30%; width: min(22%, 160px); }
    .pipes-ground { left: 60%; bottom: 16%; width: min(28%, 200px); height: 36px; }
    .pipes-ground .pipe { top: 6px; }

    .vehicles {
      flex: 0 0 auto;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: clamp(112px, 24vh, 180px);
      padding: 6px 16px 12px;
      background: var(--grass);
      border-top: 4px solid var(--grass-dark);
      z-index: 4;
    }
    .vehicle {
      flex: 1 1 0;
      height: 92%;
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .vehicle svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .vehicle.face-right svg { transform: scaleX(-1); }
    .spacer { visibility: hidden; pointer-events: none; }
    .vehicle:hover:not(.driving) { transform: translateY(-4px); }
    .vehicle.nope { animation: hop 0.55s ease; }
    @keyframes hop {
      0% { transform: translateY(0); }
      30% { transform: translateY(-16px) rotate(-4deg); }
      55% { transform: translateY(0) rotate(3deg); }
      75% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }

    .driver { opacity: 0; }
    .vehicle.occupied .driver { opacity: 1; }
    .cargo { display: none; }
    .vehicle[data-cargo="trash"] .cargo-trash,
    .vehicle[data-cargo="bricks"] .cargo-bricks,
    .vehicle[data-cargo="roof"] .cargo-roof,
    .vehicle[data-cargo="pipes"] .cargo-pipes { display: block; }

    .wheel, .drum, .blade, .boom, .bucket, .roller-drum, .leg {
      transform-box: fill-box;
      transform-origin: center;
    }
    .bed-up { opacity: 0; }
    .vehicle.dumping .bed-down { opacity: 0; }
    .vehicle.dumping .bed-up { opacity: 1; }
    .boom { transform-origin: 8% 80%; transition: transform 0.45s ease; }
    .kind-excavator .boom { transform-origin: 4% 82%; }
    .bucket { transform-origin: 0% 40%; transition: transform 0.45s ease; }
    .kind-excavator .bucket { transform-origin: 8% 20%; }
    .vehicle.lifting .boom { transform: rotate(-16deg); }
    .vehicle.digging .boom { transform: rotate(-8deg); }
    .vehicle.digging-down .boom { transform: rotate(18deg); }
    .vehicle.digging-down .bucket { transform: rotate(28deg); }
    .stream { opacity: 0; }
    .vehicle.pouring .stream { opacity: 1; }
    .vehicle.driving .wheel { animation: spin 0.74s linear infinite; }
    .kind-bulldozer.driving .blade { animation: wiggle 0.48s ease-in-out infinite; }
    .kind-roller.driving { animation: bob 0.38s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(-360deg); } }
    @keyframes wiggle { 50% { transform: translateY(4px); } }
    @keyframes bob { 50% { transform: translateY(-3px); } }

    .builder {
      position: absolute;
      left: 12px;
      width: clamp(76px, 12vh, 120px);
      z-index: 12;
      pointer-events: none;
      transition: opacity 0.2s linear;
    }
    .builder svg { width: 100%; height: auto; display: block; overflow: visible; }
    .builder:not(.walking):not(.in-cab) { animation: idle 1.6s ease-in-out infinite; }
    .builder.walking .leg.l { animation: step 0.24s ease-in-out infinite; }
    .builder.walking .leg.r { animation: step 0.24s ease-in-out infinite reverse; }
    .builder.in-cab { opacity: 0; animation: none; }
    @keyframes idle { 50% { transform: translateY(-3px); } }
    @keyframes step { 50% { transform: rotate(16deg); } }
    .leg { transform-origin: center top; }

    .bubble {
      position: absolute;
      z-index: 25;
      margin: 0;
      padding: 8px 14px;
      background: #fff;
      border: 4px solid var(--ink);
      border-radius: 16px;
      font-size: clamp(20px, 3vw, 32px);
      font-weight: 800;
    }

    #celebrate {
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }
    .confetti { position: absolute; inset: 0; overflow: hidden; }
    .confetti i {
      position: absolute;
      top: -24px;
      width: 12px;
      height: 18px;
      border: 2px solid var(--ink);
      animation: fall 2.8s linear infinite;
    }
    .confetti i:nth-child(4n + 1) { background: #ffe14a; left: 8%; }
    .confetti i:nth-child(4n + 2) { background: #e23b3b; left: 28%; animation-delay: 0.4s; }
    .confetti i:nth-child(4n + 3) { background: #3d7ec9; left: 52%; animation-delay: 0.8s; }
    .confetti i:nth-child(4n) { background: #5aa84a; left: 76%; animation-delay: 0.2s; }
    .confetti i:nth-child(n + 5) { animation-duration: 3.4s; }
    .confetti i:nth-child(5) { left: 16%; }
    .confetti i:nth-child(6) { left: 40%; }
    .confetti i:nth-child(7) { left: 64%; }
    .confetti i:nth-child(8) { left: 88%; }
    @keyframes fall { to { transform: translateY(105vh) rotate(180deg); } }
    .finale-card {
      pointer-events: auto;
      position: absolute;
      left: 50%;
      top: 10%;
      transform: translateX(-50%);
      text-align: center;
    }
    .finale-card p {
      margin: 0 0 12px;
      padding: 10px 22px;
      background: #fff;
      border: 4px solid var(--ink);
      border-radius: 20px;
      font-size: clamp(36px, 7vw, 76px);
      font-weight: 800;
    }
    #replay {
      border: 4px solid var(--ink);
      border-radius: 18px;
      background: #ffe14a;
      padding: 12px 22px;
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 800;
      cursor: pointer;
    }
    #replay:active { transform: translateY(2px); }

    #pick, #play {
      background: linear-gradient(#9ad8ff 0%, #c5ebff 38%, var(--sky) 100%);
    }
    .title, .ask, .prompt, .bubble, .finale-card p, #replay, #again {
      box-shadow: 0 4px 0 rgba(36, 48, 68, 0.16);
    }
    .choice {
      position: relative;
      box-shadow: 0 7px 0 rgba(36, 48, 68, 0.16);
    }
    .choice:active { box-shadow: 0 3px 0 rgba(36, 48, 68, 0.16); }
    .sun, .pick-sun {
      box-shadow:
        0 0 0 7px rgba(255, 225, 74, 0.35),
        inset 0 -8px 0 rgba(196, 122, 58, 0.18),
        0 4px 0 rgba(36, 48, 68, 0.14);
    }
    .sun::before, .pick-sun::before,
    .sun::after, .pick-sun::after { content: ""; position: absolute; }
    .sun::before, .pick-sun::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ink);
    }
    .sun::before { left: 15px; top: 20px; box-shadow: 20px 0 0 var(--ink); }
    .pick-sun::before { left: 20px; top: 26px; box-shadow: 24px 0 0 var(--ink); }
    .sun::after, .pick-sun::after {
      border-bottom: 3px solid var(--ink);
      border-radius: 0 0 16px 16px;
    }
    .sun::after { left: 17px; top: 32px; width: 22px; height: 10px; }
    .pick-sun::after { left: 22px; top: 40px; width: 26px; height: 12px; }
    .cloud span {
      box-shadow:
        inset 0 6px 0 rgba(255, 255, 255, 0.65),
        0 3px 0 rgba(36, 48, 68, 0.12);
    }
    .grass {
      background: linear-gradient(#8ed86a 0%, var(--grass) 28%, #4eae3c 100%);
      box-shadow: inset 0 8px 0 rgba(255, 255, 255, 0.16);
    }
    .crown {
      background: radial-gradient(circle at 35% 30%, #7ed85f, #3e9a32 62%);
      box-shadow:
        inset -8px -8px 0 rgba(36, 48, 68, 0.12),
        0 5px 0 rgba(36, 48, 68, 0.16);
    }
    .trunk { box-shadow: inset -4px 0 0 rgba(36, 48, 68, 0.15); }
    .plot {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0) 26%),
        var(--dirt);
      box-shadow:
        inset 0 -12px 0 rgba(196, 122, 58, 0.28),
        0 6px 0 rgba(36, 48, 68, 0.12);
    }
    .trench, .pipe, .bit, .blob {
      box-shadow:
        inset 0 5px 0 rgba(255, 255, 255, 0.28),
        inset 0 -5px 0 rgba(36, 48, 68, 0.12),
        0 4px 0 rgba(36, 48, 68, 0.14);
    }
    .foundation {
      box-shadow:
        inset 0 6px 0 rgba(255, 255, 255, 0.55),
        inset 0 -6px 0 rgba(36, 48, 68, 0.14),
        0 5px 0 rgba(36, 48, 68, 0.16);
    }
    .vehicle { position: relative; }
    .vehicle::before, .builder::after {
      content: "";
      position: absolute;
      left: 16%;
      right: 16%;
      bottom: 1px;
      height: 10px;
      background: rgba(36, 48, 68, 0.2);
      border-radius: 50%;
      pointer-events: none;
    }
    .vehicle svg, .house-svg, .builder svg, .loose {
      filter: drop-shadow(0 3px 0 rgba(36, 48, 68, 0.2));
    }
    .vehicle svg { position: relative; z-index: 1; }
    .builder::after { left: 12%; right: 18%; bottom: 2px; height: 9px; }

    @media (max-width: 820px) and (min-height: 620px) {
      .vehicles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        height: auto;
      }
      .vehicle { height: 104px; }

    const roofTarget = document.getElementById("roof-target");
    const pipesGround = document.getElementById("pipes-ground");
    const pipesIn = document.getElementById("pipes-in");

    const DRIVE_SCALE = 1.75;
    const travel = (ms) => Math.round(ms * DRIVE_SCALE);
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const frame = () => new Promise((resolve) => {
      requestAnimationFrame(() => requestAnimationFrame(resolve));
    });

    let stageIndex = 0;
    let busy = false;
    let run = 0;
    let spacer = null;
    let onSite = false;

    function russianVoice() {
      const synth = window.speechSynthesis;
      if (!synth) return null;
      const voices = synth.getVoices();
      return voices.find((voice) => voice.lang && voice.lang.toLowerCase().startsWith("ru")) || null;
    }

    function speak(text, opts) {
      const synth = window.speechSynthesis;
      if (!synth || !text) return;
      const say = () => {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "ru-RU";
        utter.rate = opts && opts.rate ? opts.rate : 0.9;
        utter.pitch = opts && opts.pitch ? opts.pitch : 1.08;
        const ru = russianVoice();
        if (ru) utter.voice = ru;
        synth.resume();
        synth.speak(utter);
      };
      try {
        if (synth.speaking || synth.pending) {
          synth.cancel();
          setTimeout(say, 60);
        } else {
          say();
        }
      } catch (err) {
        /* Озвучка необязательна: вопрос всё равно написан на экране. */
      }
    }

    function clearMotion(el) {
      el.getAnimations().forEach((anim) => anim.cancel());
      el.style.transform = "";
    }

    function homePos() {
      const playRect = play.getBoundingClientRect();
      const fieldRect = field.getBoundingClientRect();
      return {
        left: 10,
        top: fieldRect.bottom - playRect.top - builder.offsetHeight + 10
      };
    }

    function layoutBuilder() {
      const pos = homePos();
      builder.style.transition = "none";
      builder.style.left = pos.left + "px";
      builder.style.top = pos.top + "px";
    }

    async function walkTo(el) {
      const playRect = play.getBoundingClientRect();
      const vehicleRect = el.getBoundingClientRect();
      const builderRect = builder.getBoundingClientRect();
      builder.classList.add("walking");
      builder.style.transition = "left 620ms linear, top 620ms linear";
      builder.style.left = (vehicleRect.left - playRect.left + vehicleRect.width * 0.16) + "px";
      builder.style.top = (vehicleRect.top - playRect.top - builderRect.height * 0.62) + "px";
      await wait(660);
      builder.classList.remove("walking");
    }

    function snapBuilderTo(el) {
      const playRect = play.getBoundingClientRect();
      const vehicleRect = el.getBoundingClientRect();
      builder.style.transition = "none";
      builder.style.left = (vehicleRect.left - playRect.left + 6) + "px";
      builder.style.top = (vehicleRect.top - playRect.top - builder.offsetHeight * 0.7) + "px";
    }

    async function walkHome() {
      const pos = homePos();
      builder.classList.add("walking");
      builder.style.transition = "left 600ms linear, top 600ms linear";
      builder.style.left = pos.left + "px";
      builder.style.top = pos.top + "px";
      await wait(620);
      builder.classList.remove("walking");
    }

    async function promote(el) {
      const playRect = play.getBoundingClientRect();
      const rect = el.getBoundingClientRect();
      const hold = document.createElement("div");
      hold.className = "vehicle spacer";
      hold.setAttribute("aria-hidden", "true");
      el.parentNode.insertBefore(hold, el);
      spacer = hold;
      el.style.position = "absolute";
      el.style.margin = "0";
      el.style.width = rect.width + "px";
      el.style.left = (rect.left - playRect.left) + "px";
      el.style.top = (rect.top - playRect.top) + "px";
      el.style.zIndex = "15";
      el.style.transition = "none";
      el.style.pointerEvents = "none";
      play.appendChild(el);
      el.classList.add("driving", "occupied");
      await frame();
    }

    function pointForward(el, targetLeft) {
      const current = el.getBoundingClientRect().left;
      if (Math.abs(targetLeft - current) < 16) return;
      const movingRight = targetLeft > current;
      const frontOnRight = el.dataset.front === "right";
      el.classList.toggle("face-right", movingRight !== frontOnRight);
    }

    async function moveTo(el, leftPct, groundPct, ms) {
      if (!spacer) await promote(el);
      const playRect = play.getBoundingClientRect();
      const fieldRect = field.getBoundingClientRect();
      const box = el.querySelector("svg").viewBox.baseVal;
      let width = Math.max(140, Math.min(230, fieldRect.width * 0.2));
      let height = width * (box.height / box.width);
      const maxH = fieldRect.height * 0.5;
      if (height > maxH) {
        height = maxH;
        width = height * (box.width / box.height);
      }
      const fieldTop = fieldRect.top - playRect.top;
      const ground = fieldTop + (fieldRect.height * groundPct) / 100;
      let y = ground - height;
      y = Math.max(fieldTop + 6, Math.min(fieldRect.bottom - playRect.top - height - 6, y));
      const x = fieldRect.left - playRect.left + (fieldRect.width * leftPct) / 100 - width / 2;
      pointForward(el, playRect.left + x);
      el.style.transition = "left " + ms + "ms linear, top " + ms + "ms ease-in-out, width " + ms + "ms ease, height " + ms + "ms ease";
      el.style.width = width + "px";
      el.style.height = height + "px";
      el.style.left = x + "px";
      el.style.top = y + "px";
      await wait(ms + 40);
    }

    async function drive(el, leftPct, groundPct, ms) {
      if (!onSite) {
        const approach = moveTo(el, 50, 100, travel(640));
        await wait(travel(240));
        field.classList.add("gates-open");
        await approach;
        await wait(travel(260));
        await moveTo(el, 50, 72, travel(500));
        onSite = true;
        field.classList.remove("gates-open");
        await wait(400);
      }
      await moveTo(el, leftPct, groundPct, ms);
    }

    function park(el) {
      const hold = spacer;
      spacer = null;
      el.className = "vehicle kind-" + el.dataset.id;
      delete el.dataset.cargo;
      if (hold && hold.parentNode) hold.replaceWith(el);
      else if (el.parentElement !== dock) dock.appendChild(el);
      el.style.cssText = "";
    }

    async function returnHome(el) {
      if (!spacer) return;
      if (onSite) {
        const back = moveTo(el, 50, 72, travel(480));
        await wait(travel(160));
        field.classList.add("gates-open");
        await back;
        await wait(travel(220));
        await moveTo(el, 50, 100, travel(460));
        delete el.dataset.cargo;
        onSite = false;
      }
      const playRect = play.getBoundingClientRect();
      const slot = spacer.getBoundingClientRect();
      const ms = travel(800);
      pointForward(el, slot.left);
      el.style.transition = "left " + ms + "ms ease-in-out, top " + ms + "ms ease-in-out, width " + ms + "ms ease, height " + ms + "ms ease";
      el.style.width = slot.width + "px";
      el.style.height = slot.height + "px";
      el.style.left = (slot.left - playRect.left) + "px";
      el.style.top = (slot.top - playRect.top) + "px";
      await wait(ms + 60);
      field.classList.remove("gates-open");
      park(el);
    }

    function fly(el, target) {
      const from = el.getBoundingClientRect();
      const to = target.getBoundingClientRect();
      const dx = to.left + to.width / 2 - (from.left + from.width / 2);
      const dy = to.top + to.height / 2 - (from.top + from.height / 2);
      const anim = el.animate([
        { transform: "translate(0px, 0px)" },
        { transform: "translate(" + (dx * 0.55) + "px, " + (dy - 70) + "px)", offset: 0.5 },
        { transform: "translate(" + dx + "px, " + dy + "px)" }
      ], { duration: 1300, easing: "ease-in-out", fill: "forwards" });
      return anim.finished.catch(() => {});
    }

    async function dumpBed(el, cargo, afterLift) {
      if (cargo) el.dataset.cargo = cargo;
      el.classList.add("dumping");
      await wait(520);
      delete el.dataset.cargo;
      await afterLift();
      el.classList.remove("dumping");
      await wait(360);
    }

    const ACTIONS = {
      async clear(el) {
        await drive(el, 14, 84, travel(650));
        field.classList.add("pushing");
        await drive(el, 84, 84, travel(1300));
        field.classList.add("has-trash");
        field.classList.remove("has-debris", "pushing");
        await wait(280);
      },
      async haul(el) {
        await drive(el, 74, 82, travel(900));
        el.dataset.cargo = "trash";
        field.classList.remove("has-trash");
        await wait(450);
      },
      async pour(el) {
        await drive(el, 24, 78, travel(900));
        el.classList.add("pouring");
        field.classList.add("pouring", "has-foundation");
        await wait(1200);
        el.classList.remove("pouring");
        field.classList.remove("pouring");
      },
      async materials(el) {
        el.dataset.cargo = "bricks";
        await drive(el, 76, 80, travel(900));
        await dumpBed(el, "bricks", async () => {
          field.classList.add("has-walls");
          await wait(1050);
          field.classList.add("has-openings");
        });
      },
      async roofBring(el) {
        el.dataset.cargo = "roof";
        await drive(el, 78, 80, travel(900));
        await dumpBed(el, "roof", async () => {
          field.classList.add("has-roof-ground");
          await wait(200);
        });
      },
      async roofPlace(el) {
        await drive(el, 56, 80, travel(900));
        el.classList.add("lifting");
        await wait(360);
        await fly(roofGround, roofTarget);
        field.classList.add("has-roof");
        field.classList.remove("has-roof-ground");
        clearMotion(roofGround);
        el.classList.remove("lifting");
      },
      async dig(el) {
        el.classList.add("digging");
        await drive(el, 22, 86, travel(650));
        el.classList.add("digging-down");
        field.classList.add("has-trench");
        await drive(el, 72, 86, travel(1100));
        el.classList.remove("digging", "digging-down");
      },
      async pipesBring(el) {
        el.dataset.cargo = "pipes";
        await drive(el, 72, 84, travel(900));
        await dumpBed(el, "pipes", async () => {
          field.classList.add("has-pipes-ground");
          await wait(200);
        });
      },
      async pipesLay(el) {
        await drive(el, 50, 82, travel(900));
        el.classList.add("lifting");
        await wait(300);
        await fly(pipesGround, pipesIn);
        field.classList.add("has-pipes");
        field.classList.remove("has-pipes-ground");
        clearMotion(pipesGround);
        el.classList.remove("lifting");
      },
      async pave(el) {
        const fieldRect = field.getBoundingClientRect();
        const roadRect = document.getElementById("asphalt").getBoundingClientRect();
        const groundPct = ((roadRect.top + roadRect.height * 0.72) - fieldRect.top) / fieldRect.height * 100;
        await drive(el, 24, groundPct, travel(650));
        field.classList.add("has-asphalt");
        await drive(el, 76, groundPct, travel(1300));
      }
    };

    function showBubble(el) {
      const playRect = play.getBoundingClientRect();
      const rect = el.getBoundingClientRect();
      bubble.hidden = false;
      const bubbleRect = bubble.getBoundingClientRect();
      const left = Math.min(playRect.width - bubbleRect.width - 8, Math.max(8, rect.left - playRect.left + rect.width * 0.15));
      bubble.style.left = left + "px";
      bubble.style.top = Math.max(8, rect.top - playRect.top - bubbleRect.height - 8) + "px";
    }

    async function wrong(el) {
      busy = true;
      el.classList.remove("nope");
      void el.offsetWidth;
      el.classList.add("nope");
      showBubble(el);
      speak("Я так не умею", { pitch: 0.72, rate: 0.95 });
      await wait(1500);
      bubble.hidden = true;
      el.classList.remove("nope");
      busy = false;
    }

    async function finishStage(token) {
      speak("Молодец!");
      await wait(1200);
      if (token !== run) return;
      stageIndex += 1;
      if (stageIndex >= STAGES.length) {
        play.classList.add("finished");
        celebrate.hidden = false;
        speak("Дом готов!");
        return;
      }
      question.textContent = STAGES[stageIndex].prompt;
      speak(STAGES[stageIndex].prompt);
    }

    async function onVehicle(id) {
      if (busy || play.hidden || !celebrate.hidden || stageIndex >= STAGES.length) return;
      const stage = STAGES[stageIndex];
      const el = document.getElementById("veh-" + id);
      if (!el) return;
      if (id !== stage.vehicle) {
        await wrong(el);
        return;
      }
      busy = true;
      const token = run;
      try {
        await walkTo(el);
        if (token !== run) return;
        el.classList.add("occupied");
        builder.classList.add("in-cab");
        await wait(280);
        await ACTIONS[stage.id](el);
        if (token !== run) return;
        await returnHome(el);
        if (token !== run) return;
        snapBuilderTo(el);
        builder.classList.remove("in-cab");
        await walkHome();
        await finishStage(token);
      } finally {
        if (spacer) {
          const driving = document.querySelector(".vehicle.driving");
          if (driving) park(driving);
        }
        builder.classList.remove("in-cab", "walking");
        field.classList.remove("gates-open");
        onSite = false;
        if (token === run) busy = false;
      }
    }

    function resetVehicles() {
      document.querySelectorAll(".vehicle").forEach((el) => {
        if (el.classList.contains("spacer")) {
          el.remove();
          return;
        }
        el.className = "vehicle kind-" + el.dataset.id;
        delete el.dataset.cargo;
        el.style.cssText = "";
        if (el.parentElement !== dock) dock.appendChild(el);
      });
      spacer = null;
    }

    function backToPicker() {
      run += 1;
      busy = false;
      stageIndex = 0;
      play.classList.remove("finished");
      celebrate.hidden = true;
      bubble.hidden = true;
      play.hidden = true;
      pick.hidden = false;
      field.className = "has-debris";
      onSite = false;
      clearMotion(roofGround);
      clearMotion(pipesGround);
      builder.classList.remove("in-cab", "walking");
      resetVehicles();
    }

    function startGame(houseId) {
      const colors = HOUSES[houseId];
      play.style.setProperty("--wall", colors.wall);
      play.style.setProperty("--roof", colors.roof);
      stageIndex = 0;
      field.className = "has-debris";
      onSite = false;
      clearMotion(roofGround);
      clearMotion(pipesGround);
      resetVehicles();
      play.classList.remove("finished");
      celebrate.hidden = true;
      bubble.hidden = true;
      pick.hidden = true;
      play.hidden = false;
      question.textContent = STAGES[0].prompt;
      layoutBuilder();
      speak(STAGES[0].prompt);
    }

    const houseTpl = document.getElementById("house-tpl");
    document.querySelectorAll("[data-house]").forEach((button) => {
      button.appendChild(houseTpl.content.cloneNode(true));
      button.addEventListener("click", () => startGame(button.dataset.house));
    });
    document.getElementById("house-mount").appendChild(houseTpl.content.cloneNode(true));

    dock.addEventListener("click", (event) => {
      const button = event.target.closest(".vehicle");
      if (!button || button.classList.contains("spacer")) return;
      onVehicle(button.dataset.id);
    });
    again.addEventListener("click", () => {
      if (!celebrate.hidden) speak("Дом готов!");
      else if (STAGES[stageIndex]) speak(STAGES[stageIndex].prompt);
    });
    document.getElementById("replay").addEventListener("click", backToPicker);
    window.addEventListener("resize", () => {
      if (!play.hidden && !busy) layoutBuilder();
    });

    document.addEventListener("pointerdown", () => {
      const synth = window.speechSynthesis;
      if (synth) synth.resume();
    }, true);
    if (window.speechSynthesis) {
      window.speechSynthesis.addEventListener("voiceschanged", () => {});
    }
  </script>
</body>
</html>
